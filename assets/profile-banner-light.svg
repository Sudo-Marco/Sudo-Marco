<path class="flow" d="M 632 276 H 660 L 673 270 L 681 242 L 690 181 L 699 270 L 714 276 H 762 L 775 270 L 783 242 L 792 181 L 801 270 L 816 276 H 862 L 875 270 L 883 238 L 892 112 L 901 270 L 916 276 H 962 L 975 270 L 983 242 L 992 181 L 1001 270 L 1016 276 H 1144" pathLength="1000" fill="none" stroke="#152126" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
